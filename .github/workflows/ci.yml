name: CI

on:
  push:
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-reproducibility.txt
          python -m pip install -e '.[docs,notebooks]'
      - name: Run tests and validate tutorial notebooks
        run: |
          python scripts/build_tutorial_notebooks.py
          python -m pytest -q tests
      - name: Build documentation
        run: sphinx-build -W -b html docs/source docs/_build/html
      - name: Build and inspect release distributions
        run: |
          python -m pip install build
          python - <<'PY'
          from pathlib import Path
          import shutil
          for path in (Path("build"), Path("dist"), Path("src/smith_panel_design.egg-info")):
              if path.is_dir():
                  shutil.rmtree(path)
          PY
          python -m build --sdist --wheel
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          sdist = next(dist.glob("*.tar.gz"))
          wheel = next(dist.glob("*.whl"))
          with tarfile.open(sdist, "r:gz") as archive:
              names = archive.getnames()
              assert any(name.endswith("/README.md") for name in names)
              assert any(name.endswith("/SMITH_illu.png") for name in names)
              assert not any("/docs/internal/" in name for name in names)
              assert not any("/reproducibility/validation/" in name for name in names)
              assert not any("/outputs/" in name and not name.endswith("/outputs/.gitkeep") for name in names)
              assert not any("/sessions/" in name for name in names)
              text_names = [name for name in names if name.endswith((".yaml", ".yml", ".md", ".json", ".tsv", ".py"))]
              for name in text_names:
                  if name in names and not name.endswith("/"):
                      body = archive.extractfile(name)
                      if body:
                          assert (b"/workspace/" + b"fanyimin/") not in body.read(), name
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert any("smith_agent/resources/backends/paper_20260428/main.py" in name for name in names)
              assert any("smith_agent/resources/configs/agent/models/Agent_profile.yaml" in name for name in names)
              assert any("smith_agent/resources/configs/agent/models/ribomap_profile.yaml" in name for name in names)
              assert not any("agent_examples" in name for name in names)
              assert not any("__pycache__" in name for name in names)
          print(f"Inspected {sdist.name} and {wheel.name}")
          PY
