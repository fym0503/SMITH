name: evaluate_cross_dataset_panel
description: Evaluate a selected panel across a training AnnData and a separate test
  AnnData using SMITH split metrics.
domain: evaluation
input_schema:
  panel_path:
    type: string
  model_id:
    type: string
  train_adata_file:
    type: string
  test_adata_file:
    type: string
  panel_size:
    type: integer
  label:
    type: string
  obsm_key:
    type: string
  time_label:
    type: string
outputs:
- cross_dataset_evaluation.csv
metadata:
  handler: evaluate_cross_dataset_panel
