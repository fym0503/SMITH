name: run_smith_selection
description: Build or execute a SMITH selection run against the integrated SMITH workspace.
domain: optimization
input_schema:
  adata_file:
    type: string
  tasks:
    type: string
  task_name:
    type: string
  panel_size:
    type: integer
  model_id:
    type: string
  execute:
    type: boolean
  epoch:
    type: integer
  record:
    type: integer
  batch_size:
    type: integer
  device:
    type: string
  seed:
    type: integer
  output_dir:
    type: string
  extra_args:
    type: object
  time_label:
    type: string
  spatial_key:
    type: string
  must_keep_genes:
    type: array
    items:
      type: string
  forbidden_genes:
    type: array
    items:
      type: string
outputs:
- smith_run_manifest.json
metadata:
  handler: run_smith_selection
