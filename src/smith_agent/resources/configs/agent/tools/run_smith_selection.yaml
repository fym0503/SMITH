name: run_smith_selection
description: Build or execute a SMITH selection run against the integrated SMITH workspace.
domain: optimization
input_schema:
  adata_file:
    type: string
  tasks:
    type: string
  task_name:
    type: string
  panel_size:
    type: integer
  execute:
    type: boolean
  time_label:
    type: string
  spatial_key:
    type: string
  must_keep_genes:
    type: array
    items:
      type: string
  forbidden_genes:
    type: array
    items:
      type: string
outputs:
  - smith_run_manifest.json
metadata:
  handler: run_smith_selection
